version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # VITE_BACKEND_URL must be set in the Amplify environment variables,
            # not just locally — Vite inlines it at build time, so an unset value
            # ships a production bundle pointing at localhost.
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
